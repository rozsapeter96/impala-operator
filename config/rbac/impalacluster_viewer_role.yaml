# This rule is not used by the project impala-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to impala.operator.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: impala-operator
    app.kubernetes.io/managed-by: kustomize
  name: impalacluster-viewer-role
rules:
- apiGroups:
  - impala.operator.dev
  resources:
  - impalaclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - impala.operator.dev
  resources:
  - impalaclusters/status
  verbs:
  - get
