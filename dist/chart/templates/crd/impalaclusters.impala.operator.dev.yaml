                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  service:
                    description: ServiceSpec customises the client-facing Service.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      type:
                        default: ClusterIP
                        description: Service Type string describes ingress methods
                          for a service
                        type: string
                    type: object
                type: object
              executorGroups:
                items:
                  description: |-
                    ExecutorGroupSpec describes a family of identically sized executor groups.
                    Each group instance is one StatefulSet registered with Impala as
                    "<pool>-<name>-<index>".
                  properties:
                    args:
                      description: |-
                        args are extra daemon flags appended after the operator-generated ones,
                        so they take precedence.
                      items:
                        type: string
                      type: array
                    autoscaling:
                      description: |-
                        AutoscalingSpec lets the operator add and remove executor group instances
