                              type: object
                            maxMemResources:
                              description: |-
                                maxMemResources is the pool's aggregate memory cap in fair-scheduler
                                syntax, e.g. "50000 mb".
                              type: string
                            maxQueryMemLimit:
                              description: maxQueryMemLimit caps the per-node memory
