                        format: int32
                        minimum: 0
                        type: integer
                      jvmHeap:
                        description: jvmHeap is the embedded JVM -Xmx, e.g. "2g".
                        type: string
                      memLimit:
                        description: memLimit is passed to -mem_limit, e.g. "8gb"
                          or "80%".
                        type: string
                    type: object
                  env:
                    description: env adds environment variables to the daemon container.
