                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          domain:
                            description: domain is passed to -ldap_domain (Active
                              Directory style).
                            type: string
                          enabled:
                            description: enabled turns on -enable_ldap_auth.
                            type: boolean
                          uri:
                            description: uri of the LDAP server, e.g. "ldaps://ldap.example.com".
                            type: string
                        type: object
                      networkPolicy:
                        description: |-
                          NetworkPolicySpec isolates the cluster's daemons on the pod network.
                          Without Kerberos, Impala's internal ports (statestore, catalog, KRPC,
                          statestore subscriber) accept any peer, so any pod that can reach them can
                          register as an executor and receive query data. Enabling this renders one
                          NetworkPolicy per cluster that admits:

                            - every port from the cluster's own pods;
                            - the HiveServer2 client ports (21050, 28000) from clientFrom, or from
                              anywhere when clientFrom is empty;
                            - the daemon web UI ports (25000, 25010, 25020) from the operator's own
                              namespace (the autoscaler scrapes them) and from webUIFrom.

                          Egress is not restricted. Kubelet probes are exempt from NetworkPolicy.
                        properties:
                          clientFrom:
                            description: |-
                              clientFrom lists the peers allowed to reach the coordinator client
                              ports. Leave empty to allow any source.
                            x-kubernetes-preserve-unknown-fields: true
                          enabled:
                            type: boolean
                          webUIFrom:
                            description: |-
                              webUIFrom lists additional peers allowed to reach the daemon web UI
                              ports, e.g. a Prometheus namespace. Cluster pods and the operator's
                              namespace are always allowed.
                            x-kubernetes-preserve-unknown-fields: true
                        type: object
                      tls:
                        description: TLSSpec enables TLS for client, internal and
                          web endpoints.
                        properties:
                          certSecretRef:
                            description: |-
                              certSecretRef names a kubernetes.io/tls Secret (tls.crt, tls.key, ca.crt).
                              The certificate must cover the coordinator and executor pod DNS names,
                              typically with a wildcard "*.<cluster>-<component>-hl.<ns>.svc.cluster.local".
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          enabled:
                            description: |-
                              enabled turns on TLS for HiveServer2/Beeswax client connections and the
                              web UI of all daemons.
                            type: boolean
                          internal:
                            default: true
                            description: internal also encrypts daemon-to-daemon traffic
                              (Thrift and KRPC).
                            type: boolean
                          minimumVersion:
                            description: minimumVersion is passed to -ssl_minimum_version.
                            enum:
                            - tlsv1.2
                            - tlsv1.3
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: tls.certSecretRef is required when tls.enabled
                            is true
                          rule: '!has(self.enabled) || !self.enabled || has(self.certSecretRef)'
                    type: object
                  storage:
                    description: StorageSpec configures the object stores Impala reads
                      and writes.
                    properties:
                      s3:
                        description: s3 enables S3A configuration in core-site.xml.
                        properties:
                          credentialsSecretRef:
                            description: |-
                              credentialsSecretRef names a Secret with keys AWS_ACCESS_KEY_ID and
                              AWS_SECRET_ACCESS_KEY (optionally AWS_SESSION_TOKEN). They are injected as
                              environment variables. Omit to rely on IAM roles / IRSA.
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          endpoint:
                            description: endpoint overrides fs.s3a.endpoint (leave
                              empty for AWS).
                            type: string
                          pathStyleAccess:
                            description: pathStyleAccess sets fs.s3a.path.style.access,
                              required by MinIO and most on-prem stores.
                            type: boolean
                          region:
                            description: region sets fs.s3a.endpoint.region.
                            type: string
                        type: object
                    type: object
                required:
                - hiveMetastore
                type: object
              coordinators:
                description: CoordinatorSpec configures the coordinator StatefulSet.
                properties:
                  args:
                    description: |-
                      args are extra daemon flags appended after the operator-generated ones,
                      so they take precedence.
                    items:
                      type: string
                    type: array
                  config:
                    description: CoordinatorConfig configures coordinator impalads.
                    properties:
                      defaultQueryOptions:
                        additionalProperties:
                          type: string
                        description: defaultQueryOptions is passed to -default_query_options.
                        type: object
                      gracefulShutdownDeadlineSeconds:
                        default: 900
                        description: |-
                          gracefulShutdownDeadlineSeconds is -shutdown_deadline_s. The pod's
