    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: impalaclusters.impala.operator.dev
spec:
  group: impala.operator.dev
  names:
    kind: ImpalaCluster
    listKind: ImpalaClusterList
    plural: impalaclusters
    singular: impalacluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image.version
