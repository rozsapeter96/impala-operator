                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: kerberos.principal and kerberos.keytabSecretRef
                            are required when kerberos.enabled is true
                          rule: '!has(self.enabled) || !self.enabled || (has(self.principal)
                            && has(self.keytabSecretRef))'
                      ldap:
                        description: LDAPSpec enables LDAP password authentication
                          for clients.
                        properties:
                          allowPasswordsInClear:
                            description: allowPasswordsInClear sets -ldap_passwords_in_clear_ok
                              (only for testing).
                            type: boolean
                          baseDN:
                            description: baseDN is passed to -ldap_baseDN.
                            type: string
                          bindPattern:
                            description: bindPattern is passed to -ldap_bind_pattern,
                              e.g. "uid=#UID,ou=people,dc=example,dc=com".
                            type: string
                          caCertSecretRef:
                            description: caCertSecretRef names a Secret with key "ca.crt"
