                      properties:
                        cooldownSeconds:
                          default: 120
                          description: cooldownSeconds is the minimum time between
                            two scaling actions.
                          format: int32
                          minimum: 0
                          type: integer
                        enabled:
                          type: boolean
                        maxGroups:
                          default: 5
                          format: int32
                          minimum: 1
                          type: integer
                        minGroups:
                          default: 1
                          format: int32
                          minimum: 0
                          type: integer
                        scaleDownDelaySeconds:
                          default: 300
                          description: scaleDownDelaySeconds is how long a group must
