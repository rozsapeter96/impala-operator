                        - full
                        - mixed
                        type: string
                      jvmHeap:
                        description: jvmHeap is the embedded JVM -Xmx, e.g. "2g".
                        type: string
                    type: object
                  env:
                    description: env adds environment variables to the daemon container.
                    x-kubernetes-preserve-unknown-fields: true
                  podOverrides:
                    description: PodOverrides customises the generated pod template
                      of a component.
                    properties:
                      affinity:
                        x-kubernetes-preserve-unknown-fields: true
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      automountServiceAccountToken:
                        description: |-
                          automountServiceAccountToken controls whether the ServiceAccount token
                          is mounted into the daemon pods. Impala executes user SQL and native
                          UDFs, so the token is withheld by default; it is mounted when
                          serviceAccountName is set unless this is explicitly false.
                        type: boolean
                      initContainers:
                        x-kubernetes-preserve-unknown-fields: true
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                      nodeSelector:
                        additionalProperties:
                          type: string
                        type: object
                      priorityClassName:
                        type: string
                      securityContext:
                        x-kubernetes-preserve-unknown-fields: true
